# Causal Forcing++ Stage 3: native chunkwise DMD on EgoSim.
# EgoSim caches contain 16 latent frames, split into four causal chunks of 4.
generator_ckpt: /home/ma-user/work/users/zhengshikang/Causal-Forcing-2/checkpoints/egosim_stage2_cd_chunkwise/checkpoint_model_001000/model.pt
real_score_ckpt: /home/ma-user/work/model/EgoSim-14B/diffusion_pytorch_model.safetensors
fake_score_ckpt: /home/ma-user/work/model/EgoSim-14B/diffusion_pytorch_model.safetensors
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size

denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0

wandb_host: https://api.wandb.ai
wandb_key: ${oc.env:WANDB_API_KEY,null}
wandb_entity: 1229185024-amazon
wandb_project: egosim-causal++-stage3-chunkwise
sharding_strategy: full
cpu_offload: true
real_score_cpu_offload: true
kv_cache_cpu_offload: true
kv_cache_cpu_offload_layers: 40

lr: 2.0e-6
lr_critic: 4.0e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
weight_decay: 0.01
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
log_iters: 200
max_train_steps: 600

negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
dfake_gen_update_ratio: 5
image_or_video_shape:
  - 1
  - 16
  - 16
  - 60
  - 104

distribution_loss: dmd
trainer: egosim_score_distillation
model_type: egosim
student_arch: causal
gradient_checkpointing: true
num_frame_per_block: 4
num_training_frames: 16
load_raw_video: false
dataloader_num_workers: 0
data_path: /home/ma-user/work/users/zhengshikang/datasets/luyitas/egosim_egodex_egovid/cache/train/egodex
egosim_model_root: /home/ma-user/work/model/EgoSim-14B

checkpoint_eval_enabled: true
checkpoint_eval_lpips_torch_hub_dir: /home/ma-user/work/model/lpips

# Object-DMD track weighting for chunkwise Stage-3.
physics_track_mode: new
object_dmd_weight: 1.0
background_dmd_weight: 0.1
